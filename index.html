    <script>
      (function () {

        ["meta[property='og:image']", "meta[name='twitter:image']"].forEach(function (sel) {

        });

        if (hotel) {
          var data = JSON.parse(hotel.textContent);
          data.url = page;
          data["@id"] = page + "#hotel";

            return src.charAt(0) === "/" ? origin + src : src;
          });
          hotel.textContent = JSON.stringify(data);
        }
      })();
    </script>
